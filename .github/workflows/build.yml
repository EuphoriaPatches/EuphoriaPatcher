name: Build

on:
  push:
    paths:
      - "common/**"
      - "fabric/**"
      - "forge/**"
      - "forge1_7_10/**"
      - "forgeLegacy/**"
      - "neoforge/**"
      - "tools/**"
      - "build-logic/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "version.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The last version in the list becomes JAVA_HOME, so Gradle itself runs on 21, the others are the toolchains of the loader
      # projects and the Java versions the unit tests run on (8, 17, 21 and 25)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17
            25
            21
      - uses: gradle/actions/setup-gradle@v4
      - name: Make the Gradle wrapper executable
        run: chmod +x gradlew
      - name: Build (runs the unit tests on Java 8, 17, 21 and 25, cleans build/libs, then builds every loader jar into it)
        run: ./gradlew buildAll --console=plain
      # The runner is gone after the job, so the HTML test report is only kept if it is uploaded. Only needed when something failed
      - name: Upload the test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports-${{ github.sha }}
          path: |
            common/build/reports/tests/
            common/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload the jars
        uses: actions/upload-artifact@v4
        with:
          name: EuphoriaPatcher-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
