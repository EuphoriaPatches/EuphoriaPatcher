plugins {
	id 'fabric-loom' version '1.6-SNAPSHOT'
	id 'maven-publish'
	id 'com.github.johnrengelman.shadow' version '7.1.2'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
}

configurations {
	shade
	implementation.extendsFrom(shade)
}

dependencies {
	// Minecraft dependencies
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Mod dependencies (not shadowed)
	modCompileOnly "maven.modrinth:sodium:mc1.20.4-0.5.8"

	// Dependencies to be shadowed
	shade 'io.sigpipe:jbsdiff:1.0'
	shade 'com.google.code.gson:gson:2.8.9'

	// Apache Commons dependencies - these need to be shadowed
	shade 'org.apache.commons:commons-compress:1.21'
	shade 'commons-io:commons-io:2.11.0'
	shade 'commons-codec:commons-codec:1.15'

	// These are optional compile-time dependencies from Modrinth
	modCompileOnly "maven.modrinth:modmenu:${modmenu_version}"
	modCompileOnly "maven.modrinth:cloth-config:${cloth_config_version}"
}

// Disable the default jar task
jar.enabled = false

// Disable unnecessary tasks
tasks.remapSourcesJar.enabled = false

// Configure the shadowJar task
shadowJar {
	configurations = [project.configurations.shade]
	archiveClassifier.set('shadow')

	// Relocate the problematic libraries to avoid conflicts
	relocate 'org.apache.commons', 'mc.euphoria_patches.shadow.org.apache.commons'
	relocate 'io.sigpipe.jbsdiff', 'mc.euphoria_patches.shadow.io.sigpipe.jbsdiff'
	relocate 'com.google.gson', 'mc.euphoria_patches.shadow.com.google.gson'

	// Include license file
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}

	// Only include necessary files
	exclude 'META-INF/maven/**'
	exclude 'META-INF/*.SF'
	exclude 'META-INF/*.DSA'
	exclude 'META-INF/*.RSA'

	// Minimize the JAR by removing unused classes
	minimize()

	// Force the task to always run and not be UP-TO-DATE
	outputs.upToDateWhen { false }
}

// Configure remapJar to use shadowJar
remapJar {
	dependsOn shadowJar
	input = shadowJar.archiveFile
	archiveClassifier.set('')  // Final jar has no classifier
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 8
}

java {
	sourceCompatibility = JavaVersion.VERSION_1_8
	targetCompatibility = JavaVersion.VERSION_1_8
}

// Clean up the build directory after build
build.doLast {
	// Keep only the final remapped jar
	def buildLibs = file("${buildDir}/libs")
	buildLibs.listFiles().each { file ->
		if (file.name == "${archivesBaseName}-${version}-shadow.jar") {
			file.delete()
		}
	}
}

// Disable the maven publication to avoid generating additional artifacts
publishing {
	publications {
		// Empty to disable publications
	}
}