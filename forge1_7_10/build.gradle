plugins {
    id 'java-library'
    id 'maven-publish'
    id 'eclipse'
    id 'com.gtnewhorizons.retrofuturagradle' version '1.4.0'
    id 'com.github.johnrengelman.shadow' version '7.1.2'
    id 'me.modmuss50.mod-publish-plugin'
}

group = mod_group_id
version = "${versionProps.getProperty('mod_version')}-forge1.7.10"

base {
    archivesName = archives_base_name
}

// Set the toolchain version to Java 8
java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(8))
        vendor.set(JvmVendorSpec.AZUL)
    }
    withSourcesJar()
    withJavadocJar()
}

// RFG configuration
minecraft {
    mcVersion.set('1.7.10')
    username.set('Developer')

    injectedTags.put('VERSION', project.version.toString())

    extraRunJvmArguments.add("-ea:${project.group}")
}

// Generate Tags class
tasks.injectTags.configure {
    outputClassName.set("${project.group}.Tags")
}

// Template mcmod.info with version
processResources {
    def projVersion = project.version.toString()
    inputs.property 'version', projVersion

    filesMatching('mcmod.info') {
        expand 'version': projVersion
    }
}

configurations {
    shade
    compileOnly.extendsFrom shade
}

dependencies {
    // Common module dependency - compileOnly since it's shaded in to prevent a first-compile circular dependency issue
    compileOnly(project(':common'))

    // Dependencies to be shadowed - using standard implementation
    shade('io.sigpipe:jbsdiff:1.0')
    shade('com.google.code.gson:gson:2.8.9')
    shade('org.apache.commons:commons-compress:1.21')
    shade('commons-io:commons-io:2.11.0')
    shade('commons-codec:commons-codec:1.15')
}

// Shadow configuration - bundle specific dependencies
shadowJar {
    archiveClassifier.set('dev')

    configurations = [project.configurations.shade]

    from(project(':common').sourceSets.main.output)

    // Relocate shadowed dependencies to avoid conflicts
    relocate 'io.sigpipe', "${project.group}.shadow.io.sigpipe"
    relocate 'com.google.gson', "${project.group}.shadow.com.google.gson"
    relocate 'org.apache.commons', "${project.group}.shadow.org.apache.commons"

    // Don't minimize as common module is shaded in, which breaks minimization

    exclude 'META-INF/maven/**'
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'

    from('../LICENSE') {
        rename { "${it}_${archivesBaseName}.txt" }
    }
}

// Make regular jar not the main artifact
jar {
    archiveClassifier.set('dev-preshadow')

    manifest {
        from(project(':common').tasks.jar.manifest)
    }
}

tasks.reobfJar.configure {
    inputJar.set(tasks.shadowJar.archiveFile)
}

// Adjust artifact publishing to use shadowJar
for (String outgoingConfig : ['runtimeElements', 'apiElements']) {
    configurations[outgoingConfig].outgoing.artifacts.clear()
    configurations[outgoingConfig].outgoing.artifact(shadowJar)
}

// Make publish tasks depend on root confirmation and check skip flags
tasks.whenTaskAdded { task ->
    if (task.name == 'publishCurseforge') {
        task.dependsOn rootProject.tasks.confirmPublish
        task.onlyIf { !rootProject.ext.skipCurseforge }
    }
    if (task.name == 'publishModrinth') {
        task.dependsOn rootProject.tasks.confirmPublish
        task.onlyIf { !rootProject.ext.skipModrinth }
    }
}

// Copy reobfuscated jar to central build directory
tasks.register('copyToRootBuild', Copy) {
    dependsOn tasks.reobfJar
    from tasks.reobfJar.outputs.files
    into file("${rootProject.buildDir}/libs")
}

build.dependsOn copyToRootBuild

tasks.named('clean').configure {
    delete = fileTree(buildDir).matching {
        exclude 'rfg/**'
    }
}

publishMods {
    file = tasks.reobfJar.archiveFile

    changelog = rootProject.ext.readChangelog()

    displayName = "Euphoria Patcher ${project.version}"

    type = STABLE
    modLoaders.add('forge')

    dryRun = rootProject.ext.publishTestRun

    curseforge {
        projectId = curseforge_project_id
        accessToken = providers.environmentVariable('CURSEFORGE_TOKEN')
        minecraftVersions.add('1.7.10')
        clientRequired = true
        serverRequired = false
    }
    modrinth {
        projectId = modrinth_project_id
        accessToken = providers.environmentVariable('MODRINTH_TOKEN')
        minecraftVersions.add('1.7.10')
    }
}

tasks.named('publishMods').configure {
    dependsOn build
    dependsOn rootProject.tasks.confirmPublish
}
